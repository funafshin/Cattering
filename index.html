function clone(x){return JSON.parse(JSON.stringify(x))} function migrate(x){let d=clone(defaults);if(!x)return d;Object.assign(d,x);d.settings=Object.assign({},defaults.settings,x.settings||{});if(x.items?.length&&Array.isArray(x.items[0]))d.items=x.items.map(z=>({id:z[0],name:z[1],group:'',unit:'عدد',active:true}));if(x.services)d.services=x.services.map(s=>({...s,active:s.active!==false}));d.registers=x.registers||clone(defaults.registers);d.suppliers=x.suppliers||clone(defaults.suppliers);d.pursers=x.pursers||[];return d} function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('jsky_catering_v1')||'null'))}catch(e){return clone(defaults)}} let db=load(); function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}

function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function itemObj(c){return db.items.find(x=>x.id==c)||{}} function service(c){return db.services.find(x=>x.code==c)} function flight(date,no){return db.schedule.find(x=>normDate(x.date)==normDate(date)&&String(x.flight)==String(no))||{}} function normDate(v=''){return String(v).replace(/\D/g,'').slice(0,8)} function fmtDate(v=''){let x=normDate(v);return x.length===8?`${x.slice(0,4)}/${x.slice(4,6)}/${x.slice(6,8)}`:v}
function dateInput(id,value='',label='تاریخ شمسی'){return `<div><label>${label}</label><div class="dateField"><input id="${id}" value="${esc(fmtDate(value))}" inputmode="numeric" placeholder="1405/07/08"><button class="calBtn" type="button" onclick="openCal('${id}')">📅</button></div></div>`}
function jalaliToday(){let a=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());let o={};a.forEach(x=>o[x.type]=x.value);return +o.year*10000+(+o.month)*100+(+o.day)} function jLeap(y){return [1,5,9,13,17,22,26,30].includes(y%33)} function mdays(y,m){return m<=6?31:m<=11?30:(jLeap(y)?30:29)}
window.openCal=(id)=>{let inp=$('#'+id),n=normDate(inp.value),t=String(jalaliToday()),y=+(n.slice(0,4)||t.slice(0,4)),m=+(n.slice(4,6)||t.slice(4,6));showCal(id,y,m)};function showCal(id,y,m){let firstWeekday=weekdayJ(y,m,1),days=mdays(y,m),today=String(jalaliToday()),cur=normDate($('#'+id)?.value||'');let names=['ش','ی','د','س','چ','پ','ج'];let cells=names.map(x=>`<b>${x}</b>`).join('')+Array(firstWeekday).fill('<span></span>').join('');for(let d=1;d<=days;d++){let val=`${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`;cells+=`<button class="${val==today?'today ':''}${val==cur?'selected':''}" onclick="pickDate('${id}','${val}')">${d}</button>`}$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalBox"><div class="calHead"><button class="btn secondary sm" onclick="calMove('${id}',${y},${m},-1)">‹</button><b>${monthName(m)} ${y}</b><button class="btn secondary sm" onclick="calMove('${id}',${y},${m},1)">›</button></div><div class="calGrid">${cells}</div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="pickDate('${id}','${today}')">امروز</button><button class="btn secondary" onclick="closeModal()">بستن</button></div></div></div>`} function monthName(m){return ['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m]} window.calMove=(id,y,m,d)=>{m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}showCal(id,y,m)};window.pickDate=(id,v)=>{let e=$('#'+id);if(e){e.value=fmtDate(v);e.dispatchEvent(new Event('input'))}closeModal()};window.closeModal=()=>$('#modalRoot').innerHTML='';

function div(a,b){return ~~(a/b)} function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*((gm+9)%12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d} function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;let i=div((j%1461),4)*5+308;let gd=div(i%153,5)+1,gm=(div(i,153)%12)+1,gy=div(j,1461)-100100+div(8-gm,6);return[gy,gm,gd]} function j2d(jy,jm,jd){let r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1} function jalCal(jy){let breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178],bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,n,i;for(i=1;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(jump%33,4);jp=jm}n=jy-jp;leapJ+=div(n,33)*8+div((n%33)+3,4);if(jump%33==4&&jump-n==4)leapJ++;let leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150, march=20+leapJ-leapG;return{gy,march}} function weekdayJ(y,m,d){let g=d2g(j2d(y,m,d)),js=new Date(Date.UTC(g[0],g[1]-1,g[2])).getUTCDay();return (js+1)%7}

function renderPurser(){let p=$('#purser');p.innerHTML=`<div class="card"><h3 class="sectionTitle">فرم گزارش پرواز</h3><div class="grid">${dateInput('pdate')}<div><label>شماره پرواز</label><input id="pflight" inputmode="numeric" placeholder="Flight No"></div><div><label>رجیستر</label><select id="preg"><option value="">انتخاب...</option>${activeOpts(db.registers)}</select></div><div><label>مسیر / ساعت</label><input id="proute" readonly></div><div><label>سرویس</label><select id="pservice"><option value="">انتخاب...</option>${db.services.filter(s=>s.active!==false).map(s=>`<option value="${esc(s.code)}">${esc(s.code)} — ${esc(s.name)}</option>`).join('')}</select></div><div><label>PAX واقعی</label><input id="ppax" type="number" min="0"></div><div><label>نام سرمهماندار</label><select id="ppurser"><option value="">انتخاب...</option>${activeOpts(db.pursers,'','name','id')}</select></div><div><label>تأمین‌کننده / ایستگاه</label><select id="psupplier"><option value="">انتخاب...</option>${activeOpts(db.suppliers,'','name','id')}</select></div></div></div><div class="card"><h3 class="sectionTitle">اقلام سرویس</h3><div class="muted">اقلام Pack با انتخاب سرویس خودکار نمایش داده می‌شوند. هدف بر اساس PAX و ضریب تنظیمات محاسبه می‌شود.</div><div id="pitems" style="margin-top:10px"></div></div><div class="card"><label>توضیحات / موارد خاص</label><textarea id="pnote"></textarea><div class="actions" style="margin-top:10px"><button class="btn" id="saveReport">ثبت گزارش پرواز</button><button class="btn secondary" id="clearForm">پاک کردن فرم</button></div></div>`;
function lookup(){let f=flight($('#pdate').value,$('#pflight').value);if(f.reg)$('#preg').value=f.reg;$('#proute').value=f.route?`${f.route} | ${f.std||''}-${f.sta||''}`:''} $('#pdate').oninput=lookup;$('#pflight').oninput=lookup;$('#pservice').onchange=renderItems;$('#ppax').oninput=renderItems;function renderItems(){let s=service($('#pservice').value),pax=+$('#ppax').value||0;$('#pitems').innerHTML=!s?'<div class="note">ابتدا نوع سرویس را انتخاب کنید.</div>':s.items.filter(it=>itemObj(it[0]).active!==false).map(it=>{let target=Math.round(pax*(+it[1]||0)*(1+db.settings.supply/100));return `<div class="itemrow"><input value="${esc(it[0])}" readonly><input value="${esc(itemObj(it[0]).name||'')}" readonly><input value="${target}" readonly title="هدف"><input class="actual" data-code="${esc(it[0])}" type="number" min="0" placeholder="تحویلی"><input class="remark" data-code="${esc(it[0])}" placeholder="مغایرت/توضیح"></div>`}).join('')} $('#saveReport').onclick=()=>{let date=normDate($('#pdate').value),fn=$('#pflight').value,sc=$('#pservice').value;if(date.length!==8||!fn||!sc||!$('#ppax').value){alert('تاریخ، شماره پرواز، سرویس و PAX الزامی است.');return}let f=flight(date,fn),s=service(sc),items=$$('.actual').map(a=>{let q=+a.value||0,target=Math.round((+$('#ppax').value||0)*(+(s.items.find(x=>x[0]==a.dataset.code)||[0,0])[1])*(1+db.settings.supply/100));return{code:a.dataset.code,name:itemObj(a.dataset.code).name||'',target,actual:q,diff:q-target,note:$(`.remark[data-code="${a.dataset.code}"]`).value}});db.reports.unshift({id:Date.now(),date,flight:fn,reg:$('#preg').value||f.reg||'',route:f.route||'',std:f.std||'',sta:f.sta||'',service:sc,serviceName:s.name,pax:+$('#ppax').value,purser:$('#ppurser').selectedOptions[0]?.textContent||'',supplier:$('#psupplier').selectedOptions[0]?.textContent||'',note:$('#pnote').value,items,serviceSnapshot:clone(s),created:new Date().toISOString()});save();alert('گزارش ثبت شد.')} ;$('#clearForm').onclick=()=>renderPurser()}

let masterType='services';function renderMaster(){let p=$('#master'),types=[['services','سرویس/پک'],['items','اقلام'],['registers','رجیستر'],['suppliers','تأمین‌کننده'],['pursers','سرمهماندار']];p.innerHTML=`<div class="card"><h3 class="sectionTitle">Master Data</h3><div class="note">رکورد استفاده‌شده را بهتر است غیرفعال کنید، نه حذف؛ گزارش‌های تاریخی Snapshot خود را حفظ می‌کنند.</div><div class="masterTabs" style="margin-top:10px">${types.map(x=>`<button class="${masterType==x[0]?'on':''}" onclick="setMaster('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="masterBody"></div></div>`;renderMasterBody()} window.setMaster=x=>{masterType=x;renderMaster()};
function renderMasterBody(){let b=$('#masterBody');if(masterType==='items'){b.innerHTML=`<div class="grid"><input id="mi1" placeholder="کد قلم"><input id="mi2" placeholder="شرح قلم"><input id="mi3" placeholder="گروه"><input id="mi4" placeholder="واحد"></div><button class="btn" style="margin-top:10px" onclick="addItem()">افزودن قلم</button>${masterTable(db.items,'item')}`}
else if(masterType==='services'){b.innerHTML=`<div class="grid g2"><input id="ms1" placeholder="کد سرویس مثل BF"><input id="ms2" placeholder="نام سرویس"></div><button class="btn" style="margin-top:10px" onclick="addService()">افزودن سرویس</button><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>کد</th><th>نام</th><th>وضعیت</th><th>اقلام Pack</th><th>عملیات</th></tr></thead><tbody>${db.services.map((x,i)=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td><span class="pill ${x.active===false?'off':''}">${x.active===false?'غیرفعال':'فعال'}</span></td><td>${x.items.map(z=>esc(z[0])+' × '+z[1]).join('، ')}</td><td><button class="btn secondary sm" onclick="editSvc(${i})">ویرایش</button> <button class="btn warn sm" onclick="toggle('services',${i})">${x.active===false?'فعال':'غیرفعال'}</button></td></tr>`).join('')}</tbody></table></div>`}
else{let arr=db[masterType],title=masterType==='registers'?'رجیستر':masterType==='suppliers'?'تأمین‌کننده':'سرمهماندار';b.innerHTML=`<div class="grid g2"><input id="mg1" placeholder="کد"><input id="mg2" placeholder="${title}"></div><button class="btn" style="margin-top:10px" onclick="addGeneric('${masterType}')">افزودن</button>${masterTable(arr,'generic')}`}}
function masterTable(arr,type){return `<div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>کد</th><th>نام</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${esc(x.id||x.code)}</td><td>${esc(x.name)}</td><td><span class="pill ${x.active===false?'off':''}">${x.active===false?'غیرفعال':'فعال'}</span></td><td><button class="btn secondary sm" onclick="editMaster('${masterType}',${i})">ویرایش</button> <button class="btn warn sm" onclick="toggle('${masterType}',${i})">${x.active===false?'فعال':'غیرفعال'}</button></td></tr>`).join('')}</tbody></table></div>`} window.addItem=()=>{let id=$('#mi1').value.trim().toUpperCase(),name=$('#mi2').value.trim();if(id&&name&&!db.items.some(x=>x.id==id)){db.items.push({id,name,group:$('#mi3').value,unit:$('#mi4').value||'عدد',active:true});save()}};window.addService=()=>{let code=$('#ms1').value.trim().toUpperCase(),name=$('#ms2').value.trim();if(code&&name&&!service(code)){db.services.push({code,name,active:true,items:[]});save()}};window.addGeneric=t=>{let id=$('#mg1').value.trim().toUpperCase(),name=$('#mg2').value.trim();if(id&&name){db[t].push(t==='registers'?{code:id,name,active:true}:{id,name,active:true});save()}};window.toggle=(t,i)=>{db[t][i].active=db[t][i].active===false;save()};window.editMaster=(t,i)=>{let x=db[t][i],n=prompt('نام/شرح جدید:',x.name);if(n!==null&&n.trim()){x.name=n.trim();save()}};window.editSvc=i=>{let s=db.services[i],n=prompt('نام سرویس:',s.name);if(n!==null&&n.trim())s.name=n.trim();let raw=prompt('اقلام Pack به شکل CODE:QTY و با کاما جدا شوند:',s.items.map(x=>x.join(':')).join(','));if(raw!==null)s.items=raw.split(',').map(x=>x.trim().split(':')).filter(x=>x[0]&&itemObj(x[0].toUpperCase()).id).map(x=>[x[0].toUpperCase(),+x[1]||1]);save()};
function renderSchedule(){let p=$('#schedule');p.innerHTML=`<div class="card"><h3 class="sectionTitle">برنامه پرواز</h3><div class="note">تطبیق بر اساس تاریخ + شماره پرواز است. CSV: date,flight,route,std,sta,reg</div><div class="grid" style="margin-top:10px">${dateInput('sd')}<input id="sf" placeholder="Flight No"><input id="sr" placeholder="THR-MHD"><input id="st" placeholder="STD"><input id="sa" placeholder="STA"><select id="sg"><option value="">رجیستر...</option>${activeOpts(db.registers)}</select></div><button class="btn" id="addFlight" style="margin-top:10px">افزودن پرواز</button></div><div class="card"><div class="tableWrap"><table><thead><tr><th>تاریخ</th><th>پرواز</th><th>مسیر</th><th>STD</th><th>STA</th><th>REG</th></tr></thead><tbody>${db.schedule.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.flight)}</td><td>${esc(x.route)}</td><td>${esc(x.std)}</td><td>${esc(x.sta)}</td><td>${esc(x.reg)}</td></tr>`).join('')}</tbody></table></div></div>`;$('#addFlight').onclick=()=>{let d=normDate($('#sd').value);if(d.length!==8||!$('#sf').value)return alert('تاریخ و شماره پرواز الزامی است.');db.schedule.push({date:d,flight:$('#sf').value,route:$('#sr').value,std:$('#st').value,sta:$('#sa').value,reg:$('#sg').value});save()}}
function renderInvoice(){let p=$('#invoice');p.innerHTML=`<div class="card"><h3 class="sectionTitle">ثبت صورتحساب تأمین‌کننده</h3><div class="grid">${dateInput('idate')}<input id="ino" placeholder="شماره فاکتور"><select id="isup"><option value="">تأمین‌کننده...</option>${activeOpts(db.suppliers,'','name','id')}</select><input id="ifl" placeholder="شماره پرواز"><select id="isc"><option value="">سرویس...</option>${db.services.filter(x=>x.active!==false).map(x=>`<option value="${x.code}">${x.code} — ${x.name}</option>`).join('')}</select><input id="iqty" type="number" placeholder="تعداد فاکتور"><input id="irate" type="number" placeholder="نرخ واحد ریال"><input id="iamt" type="number" placeholder="مبلغ فاکتور ریال"></div><button class="btn" id="addInv" style="margin-top:10px">ثبت صورتحساب</button></div><div class="card"><div class="tableWrap"><table><thead><tr><th>فاکتور</th><th>تاریخ</th><th>پرواز</th><th>سرویس</th><th>تعداد فاکتور</th><th>واقعی</th><th>مغایرت تعداد</th><th>مبلغ</th><th>محاسباتی</th><th>مغایرت مبلغ</th></tr></thead><tbody>${db.invoices.map(x=>{let rr=db.reports.find(r=>r.date==x.date&&r.flight==x.flight&&r.service==x.service),actual=rr?rr.items.reduce((a,b)=>a+b.actual,0):'',calc=x.qty*x.rate,dq=actual===''?'':x.qty-actual,dm=x.amount-calc;return`<tr><td>${esc(x.no)}</td><td>${fmtDate(x.date)}</td><td>${esc(x.flight)}</td><td>${esc(x.service)}</td><td>${x.qty}</td><td>${actual}</td><td class="${dq===0?'ok':'bad'}">${dq}</td><td>${x.amount.toLocaleString()}</td><td>${calc.toLocaleString()}</td><td class="${dm===0?'ok':'bad'}">${dm.toLocaleString()}</td></tr>`}).join('')}</tbody></table></div></div>`;$('#addInv').onclick=()=>{db.invoices.unshift({id:Date.now(),date:normDate($('#idate').value),no:$('#ino').value,supplier:$('#isup').value,flight:$('#ifl').value,service:$('#isc').value,qty:+$('#iqty').value||0,rate:+$('#irate').value||0,amount:+$('#iamt').value||0});save()}}
function renderDashboard(){let reps=db.reports,short=reps.filter(r=>r.items.some(i=>i.diff<0)).length,pax=reps.reduce((a,b)=>a+(+b.pax||0),0),inv=db.invoices.reduce((a,b)=>a+(+b.amount||0),0);let by={};reps.forEach(r=>by[r.serviceName]=(by[r.serviceName]||0)+1);let mx=Math.max(1,...Object.values(by));$('#dashboard').innerHTML=`<div class="kpis"><div class="kpi">گزارش پرواز<b>${reps.length}</b></div><div class="kpi">PAX ثبت‌شده<b>${pax}</b></div><div class="kpi">پرواز دارای کسری<b>${short}</b></div><div class="kpi">جمع صورتحساب<b>${inv.toLocaleString()}</b><small> ریال</small></div></div><div class="card" style="margin-top:12px"><h3 class="sectionTitle">توزیع سرویس‌ها</h3>${Object.entries(by).map(([k,v])=>`<div style="margin:10px 0"><b>${esc(k)} — ${v}</b><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join('')||'<div class="muted">داده‌ای موجود نیست.</div>'}</div>`}
function renderSettings(){$('#settings').innerHTML=`<div class="card"><h3 class="sectionTitle">ضرایب کنترل</h3><div class="grid"><div><label>مازاد تأمین %</label><select id="sets">${[0,5,7,10,15].map(x=>`<option ${x==db.settings.supply?'selected':''}>${x}</option>`).join('')}</select></div><div><label>حد برگشتی %</label><input id="setr" type="number" value="${db.settings.returns}"></div><div><label>حد خرابی %</label><input id="setd" type="number" value="${db.settings.damage}"></div></div><button class="btn" id="saveSet" style="margin-top:10px">ذخیره تنظیمات</button></div>`;$('#saveSet').onclick=()=>{db.settings={supply:+$('#sets').value||0,returns:+$('#setr').value||0,damage:+$('#setd').value||0};save()}}
function renderBackup(){$('#backup').innerHTML=`<div class="card"><h3 class="sectionTitle">Import / Export و پشتیبان</h3><div class="note">JSON بکاپ کامل است. CSV برای Schedule Import و گزارش‌ها Export می‌شود. داده‌های V1 در اولین اجرا به V2 مهاجرت می‌کنند.</div><div class="actions" style="margin-top:12px"><button class="btn" id="expJson">Export JSON</button><button class="btn secondary" id="imp">Import JSON/CSV</button><button class="btn secondary" id="expCsv">Export Reports CSV</button><button class="btn danger" id="reset">پاک‌سازی داده‌ها</button></div></div>`;$('#expJson').onclick=()=>download('JSKY_Catering_V2_Backup.json',JSON.stringify(db,null,2),'application/json');$('#imp').onclick=()=>$('#fileInput').click();$('#expCsv').onclick=()=>{let h=['date','flight','reg','route','service','pax','purser','supplier','note'];let rows=db.reports.map(r=>h.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(','));download('JSKY_Catering_Reports.csv','\ufeff'+h.join(',')+'\n'+rows.join('\n'),'text/csv;charset=utf-8')};$('#reset').onclick=()=>{if(confirm('همه داده‌های محلی پاک شود؟')){db=clone(defaults);save()}}}
function download(n,c,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('#fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.name.toLowerCase().endsWith('.json')){try{db=migrate(JSON.parse(await f.text()));save();alert('Backup وارد شد.')}catch{alert('فایل JSON معتبر نیست.')}}else if(f.name.toLowerCase().endsWith('.csv')){let lines=(await f.text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean),head=lines.shift().split(',').map(x=>x.trim().toLowerCase());db.schedule=lines.map(l=>{let a=l.split(',');let o={};head.forEach((h,i)=>o[h]=(a[i]||'').replace(/^"|"$/g,''));o.date=normDate(o.date);return o});save();alert('Schedule CSV وارد شد.')}else alert('در نسخه آفلاین تک‌فایل، XLSX را به CSV تبدیل کنید؛ JSON/CSV مستقیم پشتیبانی می‌شود.');e.target.value=''};
function renderAll(){renderPurser();renderReports();renderMaster();renderSchedule();renderInvoice();renderDashboard();renderSettings();renderBackup()} renderAll();
</script></body></html>
