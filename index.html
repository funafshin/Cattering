<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2440"><title>JSKY Catering Control</title>
<style>
:root{--nav:#0b2440;--blue:#146c94;--bg:#f4f7fa;--card:#fff;--line:#d9e2ea;--ok:#dff4e5;--bad:#fde2e2;--warn:#fff3cd;--txt:#17212b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt)}header{background:linear-gradient(135deg,#081d34,#146c94);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0002}header h1{font-size:20px;margin:0}header small{opacity:.82}.wrap{max-width:1180px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;overflow:auto;padding:0 0 12px}.tab{white-space:nowrap;border:0;border-radius:12px;padding:10px 13px;background:#e5edf3;font-weight:700}.tab.active{background:var(--nav);color:#fff}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.g2{grid-template-columns:repeat(2,1fr)}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#4b5b68}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #cbd6df;border-radius:10px;padding:11px;background:#fff}textarea{min-height:72px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;background:var(--nav);color:#fff}.btn.secondary{background:#e6eef4;color:var(--nav)}.btn.danger{background:#a62929}.actions{display:flex;gap:8px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{display:block;font-size:23px;margin-top:5px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:850px;background:#fff}th,td{padding:9px;border-bottom:1px solid #e5ebef;text-align:center;font-size:13px}th{background:#eaf2f8;position:sticky;top:0}.ok{background:var(--ok)}.bad{background:var(--bad)}.muted{color:#71808d;font-size:12px}.pill{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#e8eef4}.sectionTitle{font-weight:900;margin:0 0 10px}.itemrow{display:grid;grid-template-columns:1.1fr 1.8fr .8fr .8fr 1.5fr;gap:7px;margin-bottom:7px}.bar{height:10px;background:#e8eef3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#146c94}.note{background:#eef6fb;border-right:4px solid #146c94;padding:10px;border-radius:10px;font-size:13px}.hidden{display:none}@media(max-width:760px){.grid,.g2,.kpis{grid-template-columns:1fr 1fr}.itemrow{grid-template-columns:1fr 1.5fr .7fr .7fr;}.itemrow input:last-child{grid-column:1/-1}header{position:relative}}@media(max-width:480px){.grid,.g2,.kpis{grid-template-columns:1fr}.wrap{padding:10px}.card{border-radius:13px}.itemrow{grid-template-columns:1fr 1fr}.itemrow>*:nth-child(5){grid-column:1/-1}}
</style></head><body><header><h1>JSKY • Catering Control</h1><small>Offline Mobile Operations & Reconciliation</small></header><main class="wrap"><nav class="tabs" id="tabs"></nav>
<section id="purser" class="page active"></section><section id="reports" class="page"></section><section id="services" class="page"></section><section id="schedule" class="page"></section><section id="invoice" class="page"></section><section id="dashboard" class="page"></section><section id="settings" class="page"></section><section id="backup" class="page"></section>
</main><input id="fileInput" type="file" class="hidden" accept=".json,.csv,.xlsx,.xls"><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='jsky_catering_v1'; const defaults={settings:{supply:5,returns:10,damage:2},items:[['CAT-001','آب معدنی'],['CAT-008','لیوان یکبار مصرف'],['CAT-009','دستمال کاغذی'],['CAT-010','دستمال مرطوب'],['CAT-014','پک صبحانه'],['CAT-015','پک ناهار'],['CAT-016','پک شام'],['CAT-017','پک اسنک']],services:[{code:'BF',name:'صبحانه',items:[['CAT-014',1],['CAT-001',1],['CAT-008',1],['CAT-009',1],['CAT-010',1]]},{code:'LN',name:'ناهار',items:[['CAT-015',1],['CAT-001',1],['CAT-008',1],['CAT-009',1],['CAT-010',1]]},{code:'DN',name:'شام',items:[['CAT-016',1],['CAT-001',1],['CAT-008',1],['CAT-009',1],['CAT-010',1]]}],schedule:[],reports:[],invoices:[]};
let db=load(); function load(){try{return Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return structuredClone(defaults)}} function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
const tabs=[['purser','ثبت سرمهماندار'],['reports','گزارش‌ها'],['services','سرویس و اقلام'],['schedule','برنامه پرواز'],['invoice','صورتحساب'],['dashboard','داشبورد'],['settings','تنظیمات'],['backup','ورود/خروج']];
$('#tabs').innerHTML=tabs.map((x,i)=>`<button class="tab ${i?'':'active'}" data-id="${x[0]}">${x[1]}</button>`).join(''); $$('.tab').forEach(b=>b.onclick=()=>{$$('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.id).classList.add('active');renderAll()});
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function today(){return new Date().toISOString().slice(0,10).replaceAll('-','')}
function flight(date,no){return db.schedule.find(x=>String(x.date)==String(date)&&String(x.flight)==String(no))||{}}
function service(code){return db.services.find(x=>x.code==code)} function itemName(code){return (db.items.find(x=>x[0]==code)||[])[1]||''}
function renderPurser(){let p=$('#purser');p.innerHTML=`<div class="card"><h3 class="sectionTitle">فرم گزارش پرواز</h3><div class="grid"><div><label>تاریخ شمسی (مثال 14050708)</label><input id="pdate" inputmode="numeric" maxlength="8"></div><div><label>شماره پرواز</label><input id="pflight" inputmode="numeric"></div><div><label>رجیستر</label><input id="preg" readonly></div><div><label>مسیر / ساعت</label><input id="proute" readonly></div><div><label>سرویس</label><select id="pservice"><option value="">انتخاب...</option>${db.services.map(s=>`<option value="${esc(s.code)}">${esc(s.code)} — ${esc(s.name)}</option>`).join('')}</select></div><div><label>PAX واقعی</label><input id="ppax" type="number" min="0"></div><div><label>نام سرمهماندار</label><input id="ppurser"></div><div><label>تأمین‌کننده / ایستگاه</label><input id="psupplier"></div></div></div><div class="card"><h3 class="sectionTitle">اقلام سرویس</h3><div class="muted">پس از انتخاب سرویس، اقلام تعریف‌شده خودکار نمایش داده می‌شوند.</div><div id="pitems" style="margin-top:10px"></div></div><div class="card"><label>توضیحات / موارد خاص</label><textarea id="pnote"></textarea><div class="actions" style="margin-top:10px"><button class="btn" id="saveReport">ثبت گزارش پرواز</button><button class="btn secondary" id="clearForm">پاک کردن فرم</button></div></div>`;
function lookup(){let f=flight($('#pdate').value,$('#pflight').value);$('#preg').value=f.reg||'';$('#proute').value=f.route?`${f.route} | ${f.std||''}-${f.sta||''}`:''} $('#pdate').oninput=lookup;$('#pflight').oninput=lookup;$('#pservice').onchange=renderItems;$('#ppax').oninput=renderItems;function renderItems(){let s=service($('#pservice').value),pax=+$('#ppax').value||0;$('#pitems').innerHTML=!s?'<div class="note">ابتدا نوع سرویس را انتخاب کنید.</div>':s.items.map((it,i)=>{let target=Math.round(pax*(+it[1]||0)*(1+db.settings.supply/100));return `<div class="itemrow"><input value="${esc(it[0])}" readonly><input value="${esc(itemName(it[0]))}" readonly><input value="${target}" readonly title="هدف"><input class="actual" data-code="${esc(it[0])}" type="number" min="0" placeholder="تحویلی"><input class="remark" data-code="${esc(it[0])}" placeholder="مغایرت/توضیح"></div>`}).join('')} $('#saveReport').onclick=()=>{let date=$('#pdate').value,fn=$('#pflight').value,sc=$('#pservice').value;if(!date||!fn||!sc||!$('#ppax').value){alert('تاریخ، شماره پرواز، سرویس و PAX الزامی است.');return}let f=flight(date,fn),s=service(sc),items=$$('.actual').map(a=>{let q=+a.value||0,target=Math.round((+$('#ppax').value||0)*(+(s.items.find(x=>x[0]==a.dataset.code)||[0,0])[1])*(1+db.settings.supply/100));return{code:a.dataset.code,name:itemName(a.dataset.code),target,actual:q,diff:q-target,note:$(`.remark[data-code="${a.dataset.code}"]`).value}});db.reports.unshift({id:Date.now(),date,flight:fn,reg:f.reg||'',route:f.route||'',std:f.std||'',sta:f.sta||'',service:sc,serviceName:s.name,pax:+$('#ppax').value,purser:$('#ppurser').value,supplier:$('#psupplier').value,note:$('#pnote').value,items,created:new Date().toISOString()});save();alert('گزارش ثبت شد.')} ;$('#clearForm').onclick=()=>renderPurser()}
function renderReports(){let r=$('#reports');r.innerHTML=`<div class="card"><h3 class="sectionTitle">گزارش‌های ثبت‌شده</h3><div class="tableWrap"><table><thead><tr><th>تاریخ</th><th>پرواز</th><th>مسیر</th><th>سرویس</th><th>PAX</th><th>سرمهماندار</th><th>مغایرت اقلام</th><th></th></tr></thead><tbody>${db.reports.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.flight)}</td><td>${esc(x.route)}</td><td>${esc(x.serviceName)}</td><td>${x.pax}</td><td>${esc(x.purser)}</td><td class="${x.items.some(i=>i.diff<0)?'bad':'ok'}">${x.items.filter(i=>i.diff<0).length}</td><td><button class="btn danger" onclick="delReport(${x.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan="8">هنوز گزارشی ثبت نشده است.</td></tr>'}</tbody></table></div></div>`} window.delReport=id=>{if(confirm('حذف شود؟')){db.reports=db.reports.filter(x=>x.id!=id);save()}}
function renderServices(){let p=$('#services');p.innerHTML=`<div class="card"><h3 class="sectionTitle">تعریف سرویس‌ها</h3><div class="grid g2"><div><label>کد سرویس</label><input id="scode" placeholder="BF"></div><div><label>نام سرویس</label><input id="sname" placeholder="صبحانه"></div></div><div class="actions" style="margin-top:10px"><button class="btn" id="addService">افزودن سرویس</button></div></div><div class="card"><div class="tableWrap"><table><thead><tr><th>کد</th><th>نام</th><th>اقلام</th><th></th></tr></thead><tbody>${db.services.map((s,i)=>`<tr><td>${esc(s.code)}</td><td>${esc(s.name)}</td><td>${s.items.map(x=>esc(x[0])+' × '+x[1]).join('، ')}</td><td><button class="btn secondary" onclick="editService(${i})">ویرایش اقلام</button></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3 class="sectionTitle">Item Master</h3><div class="grid g2"><input id="icode" placeholder="CAT-020"><input id="iname" placeholder="شرح قلم"></div><button class="btn" id="addItem" style="margin-top:10px">افزودن قلم</button><div class="tableWrap" style="margin-top:10px"><table><tbody>${db.items.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('')}</tbody></table></div></div>`;$('#addService').onclick=()=>{let c=$('#scode').value.trim().toUpperCase(),n=$('#sname').value.trim();if(c&&n&&!service(c)){db.services.push({code:c,name:n,items:[]});save()}};$('#addItem').onclick=()=>{let c=$('#icode').value.trim().toUpperCase(),n=$('#iname').value.trim();if(c&&n&&!db.items.some(x=>x[0]==c)){db.items.push([c,n]);save()}}}
window.editService=i=>{let s=db.services[i],raw=prompt('اقلام را به شکل CODE:QTY و با کاما جدا کنید',s.items.map(x=>x.join(':')).join(','));if(raw!==null){s.items=raw.split(',').map(x=>x.trim().split(':')).filter(x=>x[0]).map(x=>[x[0].toUpperCase(),+x[1]||1]);save()}}
function renderSchedule(){let p=$('#schedule');p.innerHTML=`<div class="card"><h3 class="sectionTitle">برنامه پرواز</h3><div class="note">کلید تطبیق: تاریخ + شماره پرواز. CSV با ستون‌های date,flight,route,std,sta,reg قابل Import است.</div><div class="grid" style="margin-top:10px"><input id="sd" placeholder="14050708"><input id="sf" placeholder="Flight No"><input id="sr" placeholder="THR-MHD"><input id="st" placeholder="STD"><input id="sa" placeholder="STA"><input id="sg" placeholder="EP-JIA"></div><button class="btn" id="addFlight" style="margin-top:10px">افزودن پرواز</button></div><div class="card"><div class="tableWrap"><table><thead><tr><th>تاریخ</th><th>پرواز</th><th>مسیر</th><th>STD</th><th>STA</th><th>REG</th></tr></thead><tbody>${db.schedule.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.flight)}</td><td>${esc(x.route)}</td><td>${esc(x.std)}</td><td>${esc(x.sta)}</td><td>${esc(x.reg)}</td></tr>`).join('')}</tbody></table></div></div>`;$('#addFlight').onclick=()=>{db.schedule.push({date:$('#sd').value,flight:$('#sf').value,route:$('#sr').value,std:$('#st').value,sta:$('#sa').value,reg:$('#sg').value});save()}}
function renderInvoice(){let p=$('#invoice');p.innerHTML=`<div class="card"><h3 class="sectionTitle">ثبت صورتحساب تأمین‌کننده</h3><div class="grid"><input id="idate" placeholder="تاریخ"><input id="ino" placeholder="شماره فاکتور"><input id="isup" placeholder="تأمین‌کننده"><input id="ifl" placeholder="شماره پرواز"><input id="isc" placeholder="کد سرویس"><input id="iqty" type="number" placeholder="تعداد فاکتور"><input id="irate" type="number" placeholder="نرخ واحد ریال"><input id="iamt" type="number" placeholder="مبلغ فاکتور ریال"></div><button class="btn" id="addInv" style="margin-top:10px">ثبت صورتحساب</button></div><div class="card"><div class="tableWrap"><table><thead><tr><th>فاکتور</th><th>پرواز</th><th>سرویس</th><th>تعداد فاکتور</th><th>واقعی</th><th>مغایرت تعداد</th><th>مبلغ</th><th>محاسباتی</th><th>مغایرت مبلغ</th></tr></thead><tbody>${db.invoices.map(x=>{let rr=db.reports.find(r=>r.date==x.date&&r.flight==x.flight&&r.service==x.service),actual=rr?rr.items.reduce((a,b)=>a+b.actual,0):'',calc=x.qty*x.rate,dq=actual===''?'':x.qty-actual,dm=x.amount-calc;return`<tr><td>${esc(x.no)}</td><td>${esc(x.flight)}</td><td>${esc(x.service)}</td><td>${x.qty}</td><td>${actual}</td><td class="${dq===0?'ok':'bad'}">${dq}</td><td>${x.amount.toLocaleString()}</td><td>${calc.toLocaleString()}</td><td class="${dm===0?'ok':'bad'}">${dm.toLocaleString()}</td></tr>`}).join('')}</tbody></table></div></div>`;$('#addInv').onclick=()=>{db.invoices.unshift({id:Date.now(),date:$('#idate').value,no:$('#ino').value,supplier:$('#isup').value,flight:$('#ifl').value,service:$('#isc').value.toUpperCase(),qty:+$('#iqty').value||0,rate:+$('#irate').value||0,amount:+$('#iamt').value||0});save()}}
function renderDashboard(){let reps=db.reports,short=reps.filter(r=>r.items.some(i=>i.diff<0)).length,pax=reps.reduce((a,b)=>a+(+b.pax||0),0),inv=db.invoices.reduce((a,b)=>a+(+b.amount||0),0);let by={};reps.forEach(r=>by[r.serviceName]=(by[r.serviceName]||0)+1);let mx=Math.max(1,...Object.values(by));$('#dashboard').innerHTML=`<div class="kpis"><div class="kpi">گزارش پرواز<b>${reps.length}</b></div><div class="kpi">PAX ثبت‌شده<b>${pax}</b></div><div class="kpi">پرواز دارای کسری<b>${short}</b></div><div class="kpi">جمع صورتحساب<b>${inv.toLocaleString()}</b><small> ریال</small></div></div><div class="card" style="margin-top:12px"><h3 class="sectionTitle">توزیع سرویس‌ها</h3>${Object.entries(by).map(([k,v])=>`<div style="margin:10px 0"><b>${esc(k)} — ${v}</b><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join('')||'<div class="muted">داده‌ای موجود نیست.</div>'}</div>`}
function renderSettings(){$('#settings').innerHTML=`<div class="card"><h3 class="sectionTitle">ضرایب کنترل</h3><div class="grid"><div><label>مازاد تأمین %</label><input id="sets" type="number" value="${db.settings.supply}"></div><div><label>حد برگشتی %</label><input id="setr" type="number" value="${db.settings.returns}"></div><div><label>حد خرابی %</label><input id="setd" type="number" value="${db.settings.damage}"></div></div><button class="btn" id="saveSet" style="margin-top:10px">ذخیره تنظیمات</button></div>`;$('#saveSet').onclick=()=>{db.settings={supply:+$('#sets').value||0,returns:+$('#setr').value||0,damage:+$('#setd').value||0};save()}}
function renderBackup(){$('#backup').innerHTML=`<div class="card"><h3 class="sectionTitle">Import / Export و پشتیبان</h3><div class="note">JSON بکاپ کامل سیستم است. CSV برای Schedule قابل Import است. Export گزارش‌ها به CSV برای بازکردن در Excel آماده است.</div><div class="actions" style="margin-top:12px"><button class="btn" id="expJson">Export JSON</button><button class="btn secondary" id="imp">Import JSON/CSV</button><button class="btn secondary" id="expCsv">Export Reports CSV</button><button class="btn danger" id="reset">پاک‌سازی داده‌ها</button></div></div>`;$('#expJson').onclick=()=>download('JSKY_Catering_Backup.json',JSON.stringify(db,null,2),'application/json');$('#imp').onclick=()=>$('#fileInput').click();$('#expCsv').onclick=()=>{let h=['date','flight','reg','route','service','pax','purser','supplier','note'];let rows=db.reports.map(r=>h.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(','));download('JSKY_Catering_Reports.csv','\ufeff'+h.join(',')+'\n'+rows.join('\n'),'text/csv;charset=utf-8')};$('#reset').onclick=()=>{if(confirm('همه داده‌های محلی پاک شود؟')){db=structuredClone(defaults);save()}}}
function download(n,c,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}
$('#fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.name.toLowerCase().endsWith('.json')){try{db=JSON.parse(await f.text());save();alert('Backup وارد شد.')}catch{alert('فایل JSON معتبر نیست.')}}else if(f.name.toLowerCase().endsWith('.csv')){let lines=(await f.text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean),head=lines.shift().split(',').map(x=>x.trim().toLowerCase());db.schedule=lines.map(l=>{let a=l.split(',');let o={};head.forEach((h,i)=>o[h]=(a[i]||'').replace(/^"|"$/g,''));return o});save();alert('Schedule CSV وارد شد.')}else alert('در نسخه تک‌فایل آفلاین، XLSX را ابتدا به CSV تبدیل کنید؛ JSON/CSV مستقیم پشتیبانی می‌شود.');e.target.value=''};
function renderAll(){renderPurser();renderReports();renderServices();renderSchedule();renderInvoice();renderDashboard();renderSettings();renderBackup()} renderAll();
</script></body></html>
