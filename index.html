window.openCal=(id)=>{let inp=$('#'+id),n=normDate(inp.value),t=String(jalaliToday()),y=+(n.slice(0,4)||t.slice(0,4)),m=+(n.slice(4,6)||t.slice(4,6));showCal(id,y,m)};function showCal(id,y,m){let firstWeekday=weekdayJ(y,m,1),days=mdays(y,m),today=String(jalaliToday()),cur=normDate($('#'+id)?.value||'');let names=['ش','ی','د','س','چ','پ','ج'];let cells=names.map(x=>`<b>${x}</b>`).join('')+Array(firstWeekday).fill('<span></span>').join('');for(let d=1;d<=days;d++){let val=`${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`;cells+=`<button class="${val==today?'today ':''}${val==cur?'selected':''}" onclick="pickDate('${id}','${val}')">${d}</button>`}$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalBox"><div class="calHead"><button class="btn secondary sm" onclick="calMove('${id}',${y},${m},-1)">‹</button><b>${monthName(m)} ${y}</b><button class="btn secondary sm" onclick="calMove('${id}',${y},${m},1)">›</button></div><div class="calGrid">${cells}</div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="pickDate('${id}','${today}')">امروز</button><button class="btn secondary" onclick="closeModal()">بستن</button></div></div></div>`} function monthName(m){return ['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m]} window.calMove=(id,y,m,d)=>{m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}showCal(id,y,m)};window.pickDate=(id,v)=>{let e=$('#'+id);if(e){e.value=fmtDate(v);e.dispatchEvent(new Event('input'))}closeModal()};window.closeModal=()=>$('#modalRoot').innerHTML='';
// Persian date weekday: use conversion only to determine weekday via Intl Date. Algorithm from standard Jalaali conversion.
function div(a,b){return ~~(a/b)} function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*((gm+9)%12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d} function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;let i=div((j%1461),4)*5+308;let gd=div(i%153,5)+1,gm=(div(i,153)%12)+1,gy=div(j,1461)-100100+div(8-gm,6);return[gy,gm,gd]} function j2d(jy,jm,jd){let r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1} function jalCal(jy){let breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178],bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,n,i;for(i=1;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(jump%33,4);jp=jm}n=jy-jp;leapJ+=div(n,33)*8+div((n%33)+3,4);if(jump%33==4&&jump-n==4)leapJ++;let leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150, march=20+leapJ-leapG;return{gy,march}} function weekdayJ(y,m,d){let g=d2g(j2d(y,m,d)),js=new Date(Date.UTC(g[0],g[1]-1,g[2])).getUTCDay();return (js+1)%7}
function activeOpts(arr,val,name='name',code='code'){return arr.filter(x=>x.active!==false).map(x=>{let v=x[code]??x[name],n=x[name]??v,label=String(v)===String(n)?n:(x[code]?v+' — '+n:n);return `<option value="${esc(v)}" ${v==val?'selected':''}>${esc(label)}</option>`}).join('')}
function serviceOptions(exclude=''){return db.services.filter(s=>s.active!==false&&s.code!==exclude).map(s=>`<option value="${esc(s.code)}">${esc(s.name)}</option>`).join('')}
function stationOptions(val=''){return db.stations.filter(x=>x.active!==false).map(x=>`<option value="${esc(x.code)}" ${x.code===val?'selected':''}>${esc(x.code)} — ${esc(x.name)}</option>`).join('')}

$('#saveReport').onclick=()=>{let date=normDate($('#pdate').value),fn=String($('#pflight').value||'').trim(),purser=String($('#ppurser').value||'').trim(),codes=[$('#pservice1').value,$('#pservice2').value].filter(Boolean);if(date.length!==8||!fn||!codes.length||!$('#ppax').value||!purser){alert('تاریخ، شماره پرواز، حداقل یک سرویس، PAX و سرمهماندار الزامی است.');return}if(db.reports.some(r=>r.date===date&&String(r.flight)===fn)&&!confirm('برای این تاریخ و شماره پرواز قبلاً گزارش ثبت شده است. گزارش جدید هم ثبت شود؟'))return;let pax=+$('#ppax').value,items=$$('.actual').map(a=>{let s=service(a.dataset.service),ratio=+(s.items.find(x=>x[0]===a.dataset.code)||[0,0])[1],q=+a.value||0,target=+$(`.target[data-service="${a.dataset.service}"][data-code="${a.dataset.code}"]`)?.value||Math.round(pax*ratio*(1+db.settings.supply/100));let noteEl=$(`.remark[data-service="${a.dataset.service}"][data-code="${a.dataset.code}"]`);return{service:a.dataset.service,code:a.dataset.code,name:itemObj(a.dataset.code).name||'',target,actual:q,diff:q-target,note:noteEl?.value||''}});let origin=$('#porigin').value,destination=$('#pdestination').value;db.reports.unshift({id:Date.now(),date,flight:fn,reg:$('#preg').value,origin,destination,route:[origin,destination].filter(Boolean).join('-'),std:$('#pstd').value,sta:$('#psta').value,services:codes,serviceNames:codes.map(c=>service(c)?.name||c),service:codes[0],serviceName:codes.map(c=>service(c)?.name||c).join(' + '),pax,purser,supplier:$('#psupplier').selectedOptions[0]?.textContent.trim()||'',station:$('#psupplier').value,note:$('#pnote').value,items,serviceSnapshot:codes.map(c=>clone(service(c))),created:new Date().toISOString()});save();alert('گزارش پرواز ثبت شد.')} ;$('#clearForm').onclick=()=>renderPurser()}

function renderSchedule(){let p=$('#schedule');p.innerHTML=`<div class="card"><h3 class="sectionTitle">برنامه پرواز / Roster Import</h3><div class="note">برنامه نامه برقراری 748053801 برای 1405/07/11 تا 1405/07/17 از ابتدا داخل سیستم بارگذاری شده است. فرمت استاندارد CSV برای برنامه‌های بعدی: date,flight,origin,destination,std,sta,reg,station. بعد از Import، سرمهماندار تاریخ را انتخاب می‌کند و فقط پروازهای همان روز در فرم او نمایش داده می‌شود.</div><div class="actions" style="margin-top:10px"><button class="btn secondary" id="importRoster">آپلود برنامه پرواز / Roster</button></div><div class="grid" style="margin-top:10px">${dateInput('sd')}<input id="sf" placeholder="Flight No"><select id="so"><option value="">مبدأ...</option>${stationOptions()}</select><select id="sdes"><option value="">مقصد...</option>${stationOptions()}</select><input id="st" placeholder="STD"><input id="sa" placeholder="STA"><select id="sg"><option value="">رجیستر...</option>${activeOpts(db.registers)}</select><select id="sst"><option value="">ایستگاه تأمین...</option>${stationOptions()}</select></div><button class="btn" id="addFlight" style="margin-top:10px">افزودن پرواز</button></div><div class="card"><div class="tableWrap"><table><thead><tr><th>تاریخ</th><th>پرواز</th><th>مبدأ</th><th>مقصد</th><th>STD</th><th>STA</th><th>REG</th><th>ایستگاه</th></tr></thead><tbody>${db.schedule.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.flight)}</td><td>${esc(x.origin||'')}</td><td>${esc(x.destination||'')}</td><td>${esc(x.std||'')}</td><td>${esc(x.sta||'')}</td><td>${esc(x.reg||'')}</td><td>${esc(x.station||'')}</td></tr>`).join('')}</tbody></table></div></div>`;$('#importRoster').onclick=()=>{$('#fileInput').dataset.mode='schedule';$('#fileInput').click()};$('#addFlight').onclick=()=>{let d=normDate($('#sd').value);if(d.length!==8||!$('#sf').value)return alert('تاریخ و شماره پرواز الزامی است.');db.schedule.push({date:d,flight:$('#sf').value,origin:$('#so').value,destination:$('#sdes').value,route:[$('#so').value,$('#sdes').value].filter(Boolean).join('-'),std:$('#st').value,sta:$('#sa').value,reg:$('#sg').value,station:$('#sst').value});save()}}
function renderInvoice(){let p=$('#invoice');p.innerHTML=`<div class="card"><h3 class="sectionTitle">ثبت صورتحساب تأمین‌کننده</h3><div class="grid">${dateInput('idate')}<input id="ino" placeholder="شماره فاکتور"><select id="isup"><option value="">تأمین‌کننده...</option>${activeOpts(db.suppliers,'','name','id')}</select><input id="ifl" placeholder="شماره پرواز"><select id="isc"><option value="">سرویس...</option>${serviceOptions()}</select><input id="iqty" type="number" placeholder="تعداد فاکتور"><input id="irate" type="number" placeholder="نرخ واحد ریال"><input id="iamt" type="number" placeholder="مبلغ فاکتور ریال"></div><button class="btn" id="addInv" style="margin-top:10px">ثبت صورتحساب</button></div><div class="card"><div class="tableWrap"><table><thead><tr><th>فاکتور</th><th>تاریخ</th><th>پرواز</th><th>سرویس</th><th>تعداد فاکتور</th><th>واقعی</th><th>مغایرت تعداد</th><th>مبلغ</th><th>محاسباتی</th><th>مغایرت مبلغ</th></tr></thead><tbody>${db.invoices.map(x=>{let rr=db.reports.find(r=>r.date==x.date&&r.flight==x.flight&&(r.services||[r.service]).includes(x.service)),actual=rr?rr.items.filter(i=>i.service===x.service||!i.service).reduce((a,b)=>a+b.actual,0):'',calc=x.qty*x.rate,dq=actual===''?'':x.qty-actual,dm=x.amount-calc;return`<tr><td>${esc(x.no)}</td><td>${fmtDate(x.date)}</td><td>${esc(x.flight)}</td><td>${esc(x.service)}</td><td>${x.qty}</td><td>${actual}</td><td class="${dq===0?'ok':'bad'}">${dq}</td><td>${x.amount.toLocaleString()}</td><td>${calc.toLocaleString()}</td><td class="${dm===0?'ok':'bad'}">${dm.toLocaleString()}</td></tr>`}).join('')}</tbody></table></div></div>`;$('#addInv').onclick=()=>{db.invoices.unshift({id:Date.now(),date:normDate($('#idate').value),no:$('#ino').value,supplier:$('#isup').value,flight:$('#ifl').value,service:$('#isc').value,qty:+$('#iqty').value||0,rate:+$('#irate').value||0,amount:+$('#iamt').value||0});save()}}
function renderDashboard(){let reps=db.reports,short=reps.filter(r=>r.items.some(i=>i.diff<0)).length,pax=reps.reduce((a,b)=>a+(+b.pax||0),0),inv=db.invoices.reduce((a,b)=>a+(+b.amount||0),0);let by={};reps.forEach(r=>(r.serviceNames||[r.serviceName]).filter(Boolean).forEach(n=>by[n]=(by[n]||0)+1));let mx=Math.max(1,...Object.values(by));$('#dashboard').innerHTML=`<div class="kpis"><div class="kpi">گزارش پرواز<b>${reps.length}</b></div><div class="kpi">PAX ثبت‌شده<b>${pax}</b></div><div class="kpi">پرواز دارای کسری<b>${short}</b></div><div class="kpi">جمع صورتحساب<b>${inv.toLocaleString()}</b><small> ریال</small></div></div><div class="card" style="margin-top:12px"><h3 class="sectionTitle">توزیع سرویس‌ها</h3>${Object.entries(by).map(([k,v])=>`<div style="margin:10px 0"><b>${esc(k)} — ${v}</b><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join('')||'<div class="muted">داده‌ای موجود نیست.</div>'}</div>`}
function renderSettings(){$('#settings').innerHTML=`<div class="card"><h3 class="sectionTitle">ضرایب کنترل</h3><div class="grid"><div><label>مازاد تأمین %</label><select id="sets">${[0,5,7,10,15].map(x=>`<option ${x==db.settings.supply?'selected':''}>${x}</option>`).join('')}</select></div><div><label>حد برگشتی %</label><input id="setr" type="number" value="${db.settings.returns}"></div><div><label>حد خرابی %</label><input id="setd" type="number" value="${db.settings.damage}"></div></div><button class="btn" id="saveSet" style="margin-top:10px">ذخیره تنظیمات</button></div>`;$('#saveSet').onclick=()=>{db.settings={supply:+$('#sets').value||0,returns:+$('#setr').value||0,damage:+$('#setd').value||0};save()}}
function renderBackup(){$('#backup').innerHTML=`<div class="card"><h3 class="sectionTitle">Import / Export و پشتیبان</h3><div class="note">JSON بکاپ کامل است. برنامه پرواز/Roster با CSV وارد می‌شود. اگر فایل اصلی شما XLSX است، نمونه را بدهید تا Import مستقیم دقیقاً با ستون‌های همان فایل تنظیم شود.</div><div class="actions" style="margin-top:12px"><button class="btn" id="expJson">Export JSON</button><button class="btn secondary" id="imp">Import JSON/CSV</button><button class="btn secondary" id="expCsv">Export Reports CSV</button><button class="btn danger" id="reset">پاک‌سازی داده‌ها</button></div></div>`;$('#expJson').onclick=()=>download('JSKY_Catering_V3_2_Backup.json',JSON.stringify(db,null,2),'application/json');$('#imp').onclick=()=>{$('#fileInput').dataset.mode='auto';$('#fileInput').click()};$('#expCsv').onclick=()=>{let h=['date','flight','reg','origin','destination','services','pax','purser','supplier','note'];let rows=db.reports.map(r=>[r.date,r.flight,r.reg,r.origin,r.destination,(r.serviceNames||[]).join('+'),r.pax,r.purser,r.supplier,r.note].map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(','));download('JSKY_Catering_Reports.csv','\ufeff'+h.join(',')+'\n'+rows.join('\n'),'text/csv;charset=utf-8')};$('#reset').onclick=()=>{if(confirm('همه داده‌های محلی پاک شود؟')){db=clone(defaults);save()}}}
function download(n,c,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function normalizeScheduleRow(o){let pick=(...ks)=>{for(let k of ks)if(o[k]!=null&&String(o[k]).trim()!=='')return String(o[k]).trim();return''};let date=normDate(pick('date','تاریخ','flight date')),flightNo=pick('flight','flightno','flight no','شماره پرواز'),origin=pick('origin','from','مبدا','مبدأ'),destination=pick('destination','to','مقصد'),route=pick('route','مسیر');if((!origin||!destination)&&route){let a=route.split(/[-–—>→\/]/).map(x=>x.trim());origin=origin||a[0]||'';destination=destination||a[1]||''}return{date,flight:flightNo,origin:origin.toUpperCase(),destination:destination.toUpperCase(),route:[origin,destination].filter(Boolean).join('-').toUpperCase(),std:pick('std','departure','زمان پرواز'),sta:pick('sta','arrival','زمان ورود'),reg:pick('reg','register','registration','رجیستر').toUpperCase(),station:pick('station','catering station','ایستگاه').toUpperCase()}}
$('#fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;let name=f.name.toLowerCase();if(name.endsWith('.json')){try{db=migrate(JSON.parse(await f.text()));save();alert('Backup وارد شد.')}catch{alert('فایل JSON معتبر نیست.')}}else if(name.endsWith('.csv')){let rows=parseCSV((await f.text()).replace(/^\ufeff/,''));if(rows.length<2)return alert('CSV خالی است.');let head=rows.shift().map(x=>x.trim().toLowerCase()),arr=rows.map(a=>{let o={};head.forEach((h,i)=>o[h]=a[i]||'');return normalizeScheduleRow(o)}).filter(x=>x.date&&x.flight);db.schedule=arr;save();alert(`${arr.length} پرواز وارد شد.`)}else alert('فعلاً CSV/JSON مستقیم پشتیبانی می‌شود. فایل نمونه XLSX روستر را ارسال کنید تا Import مستقیم Excel بر اساس ستون‌های واقعی آن اضافه شود.');e.target.value=''};
function showSweetJoke(){
  const old=document.getElementById('sweetJokeModal'); if(old) old.remove();
  const m=document.createElement('div'); m.id='sweetJokeModal'; m.className='modal';
  m.innerHTML=`<div class="modalBox" style="text-align:center"><div style="font-size:38px;margin:4px 0 8px">😂🍰</div><div style="font-size:17px;font-weight:900;line-height:2">معین و سعید و محمد، شیرینی را با زبون خوش خودتان بیارید 😂</div><button class="btn" id="closeSweetJoke" style="margin-top:14px;min-width:120px">باشه 😂</button></div>`;
  document.body.appendChild(m);
  document.getElementById('closeSweetJoke').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove()};
}
document.getElementById('appTitle').addEventListener('click',showSweetJoke);
function renderAll(){renderPurser();renderReports();renderMaster();renderSchedule();renderInvoice();renderDashboard();renderSettings();renderBackup()} renderAll();
</script></body></html>
